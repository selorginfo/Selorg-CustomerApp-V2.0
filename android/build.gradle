buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        REACT_NATIVE_NODE_MODULES_DIR = "$rootDir/../node_modules/react-native"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Needed once android/app/build.gradle's google-services plugin line is uncommented.
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            url("$rootDir/../node_modules/@react-native-async-storage/async-storage/android/local_repo")
        }
    }
}

// OneDrive + spaces in the project path make ninja treat build.ninja as forever-dirty
// under node_modules/**/android/.cxx. Mirror app/build.gradle's C:/scxx2 staging
// for Android libraries. Must run when the plugin is applied (not afterEvaluate).
subprojects { subproject ->
    subproject.pluginManager.withPlugin("com.android.library") {
        def staging = new File("C:/scxx-libs/${subproject.name}")
        staging.mkdirs()
        subproject.android {
            externalNativeBuild {
                cmake {
                    buildStagingDirectory staging
                }
            }
        }
    }
}
