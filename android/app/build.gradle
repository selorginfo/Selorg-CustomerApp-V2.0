apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]
    debuggableVariants = ["selorgDebug", "sodakkuDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Sodakku release signing lives in android/keystore-sodakku.properties (gitignored).
def sodakkuKeystorePropertiesFile = rootProject.file("keystore-sodakku.properties")
def sodakkuKeystoreProperties = new Properties()
if (sodakkuKeystorePropertiesFile.exists()) {
    sodakkuKeystorePropertiesFile.withInputStream { sodakkuKeystoreProperties.load(it) }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.selorg.com"
    defaultConfig {
        applicationId "com.selorg.com"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "2.0.0"
        // RN manifest merge previously referenced ${usesCleartextTraffic} without a value — enforce LAN HTTP for dev API.
        manifestPlaceholders = [usesCleartextTraffic: "true"]
        // Ninja rejects object paths of 260+ characters. CMake only hashes an
        // object name when this limit is above the object-directory length plus
        // the source filename, and below that directory length plus the full
        // object name. 220 is inside that window once the CMake staging
        // directory is the short path set below.
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_OBJECT_PATH_MAX=220"
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('selorg-customer-app-keystore.jks')
            storePassword 'selorg'
            keyAlias 'selorg'
            keyPassword 'selorg'
        }
        sodakkuRelease {
            if (sodakkuKeystoreProperties.getProperty('storeFile')) {
                storeFile file(sodakkuKeystoreProperties.getProperty('storeFile'))
                storePassword sodakkuKeystoreProperties.getProperty('storePassword')
                keyAlias sodakkuKeystoreProperties.getProperty('keyAlias')
                keyPassword sodakkuKeystoreProperties.getProperty('keyPassword')
            }
        }
    }
    // One flavor per brand. applicationId must match
    // src/brands/<brand>/native.json (npm run brand:native-check).
    // Selorg resources, google-services.json and signing stay in main / app root;
    // a partner brand ships its own under android/app/src/<flavor>/.
    // Release signing is per flavor: a build-type signingConfig would override it.
    flavorDimensions "brand"
    productFlavors {
        selorg {
            dimension "brand"
            applicationId "com.selorg.com"
            signingConfig signingConfigs.release
        }
        sodakku {
            dimension "brand"
            applicationId "com.sodakku.com"
            signingConfig signingConfigs.sodakkuRelease
        }
    }
    // The default staging folder lives under this OneDrive path, so even hashed
    // object files still exceed Windows' 260-character limit.
    externalNativeBuild {
        cmake {
            buildStagingDirectory "C:/scxx2"
        }
    }
    // Fat debug APK (~200MB) + wireless ADB often exceeds the default ~4min
    // shell timeout (ShellCommandUnresponsiveException on installDebug).
    adbOptions {
        timeOutInMs 15 * 60 * 1000
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    applicationVariants.all { variant ->
        def artifactBrand = variant.flavorName
        variant.outputs.all { output ->
            def version = variant.versionName
            outputFileName = "${artifactBrand}-customer-app-${version}.apk"
        }

        // Refuse to bundle one brand's JS / .env into another brand's package.
        def flavor = variant.flavorName
        def appRoot = rootProject.projectDir.parentFile
        tasks.matching { it.name == "createBundle${variant.name.capitalize()}JsAndAssets" }.configureEach { jsTask ->
            jsTask.doFirst {
                def toFlavor = { String key -> key.replaceAll(/-([a-z])/) { all, c -> c.toUpperCase() } }
                def generated = new File(appRoot, "src/brands/active.generated.ts")
                def active = generated.exists() ? ((generated.text =~ /ACTIVE_BRAND_KEY\s*=\s*'([^']+)'/).with { it.find() ? it.group(1) : null }) : "selorg"
                if (active == null || toFlavor(active) != flavor) {
                    throw new GradleException("Active JS brand '${active}' does not match flavor '${flavor}'. Run: npm run brand -- <brand> <mode>")
                }
                // Selorg bundles the root .env; a partner bundles env/<brand>/.env.resolved (see scripts/brand-env.js).
                def dotenv = active == "selorg" ? new File(appRoot, ".env") : new File(appRoot, "env/${active}/.env.resolved")
                if (active != "selorg" && !dotenv.exists()) {
                    throw new GradleException("env/${active}/.env.resolved is missing. Run: npm run brand -- ${active} <mode>")
                }
                def envBrand = dotenv.exists() ? dotenv.readLines().find { it.trim().startsWith("BRAND_KEY=") }?.split("=", 2)?.getAt(1)?.trim() : null
                if (envBrand && toFlavor(envBrand) != flavor) {
                    throw new GradleException("${dotenv.name} BRAND_KEY '${envBrand}' does not match flavor '${flavor}'. Run: npm run brand -- <brand> <mode>")
                }
                def activeMode = generated.exists() ? ((generated.text =~ /ACTIVE_BRAND_ENV\s*=\s*'([^']+)'/).with { it.find() ? it.group(1) : null }) : null
                if (active != "selorg" && variant.buildType.name == "release" && activeMode != "production") {
                    throw new GradleException("Release ${flavor} build needs production config. Run: npm run brand -- ${active} production")
                }
                // The plugin never clears this folder, so a previous brand's images would ship.
                project.delete(jsTask.resourcesDir.get().asFile)
            }
        }

        tasks.named("bundle${variant.name.capitalize()}").configure { bundleTask ->
            bundleTask.doLast {
                def version = variant.versionName
                def aabDir = new File("${buildDir}/outputs/bundle/${variant.name}")
                aabDir.listFiles()?.each { file ->
                    if (file.name.endsWith(".aab")) {
                        file.renameTo(new File(aabDir, "${artifactBrand}-customer-app-${version}.aab"))
                    }
                }
            }
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Android 12+ splash handoff (prevents stuck black splash over RN content)
    implementation("androidx.core:core-splashscreen:1.0.1")

    // Add support for animated GIFs and WebP images (e.g. Cloudinary dynamic outputs)
    implementation("com.facebook.fresco:animated-gif:3.6.0")
    implementation("com.facebook.fresco:animated-webp:3.6.0")
    implementation("com.facebook.fresco:webpsupport:3.6.0")

    // AsyncStorage pulls sqlite-bundled 2.6.0 and datastore 1.1.7, whose
    // libsqliteJni.so / libdatastore_shared_counter.so have RELRO segments that
    // fail Android 15+ 16 KB page-size checks.
    constraints {
        ["sqlite", "sqlite-framework", "sqlite-bundled"].each { artifact ->
            implementation("androidx.sqlite:${artifact}:2.6.2") {
                because "16 KB page-size aligned libsqliteJni.so"
            }
        }
        ["datastore", "datastore-core", "datastore-core-okio", "datastore-preferences", "datastore-preferences-core"].each { artifact ->
            implementation("androidx.datastore:${artifact}:1.2.1") {
                because "16 KB page-size aligned libdatastore_shared_counter.so"
            }
        }
    }
}

apply plugin: "com.google.gms.google-services"

// A Sodakku release must be signed with the Sodakku upload key, never silently unsigned.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains("sodakkurelease") }
            && !sodakkuKeystorePropertiesFile.exists()) {
        throw new GradleException(
            "Missing android/keystore-sodakku.properties - copy keystore-sodakku.properties.example " +
            "and fill in the Sodakku release signing credentials before building a Sodakku release.")
    }
}
