apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.selorg.com"
    defaultConfig {
        applicationId "com.selorg.com"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "2.0.0"
        // Release denies cleartext. The debug build type overrides this.
        manifestPlaceholders = [
            usesCleartextTraffic: "false",
            GOOGLE_MAPS_API_KEY: project.findProperty("GOOGLE_MAPS_API_KEY") ?: ""
        ]
        // Ninja rejects object paths of 260+ characters. CMake only hashes an
        // object name when this limit is above the object-directory length plus
        // the source filename, and below that directory length plus the full
        // object name. 220 is inside that window once the CMake staging
        // directory is the short path set below.
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_OBJECT_PATH_MAX=220"
            }
        }
    }
    // The default staging folder lives under this OneDrive path, so even hashed
    // object files still exceed Windows' 260-character limit.
    externalNativeBuild {
        cmake {
            buildStagingDirectory "C:/scxx2"
        }
    }
    // Fat debug APK (~200MB) + wireless ADB often exceeds the default ~4min
    // shell timeout (ShellCommandUnresponsiveException on installDebug).
    adbOptions {
        timeOutInMs 15 * 60 * 1000
    }
    // Upload keystore credentials: ~/.gradle/gradle.properties or CI only — never commit.
    // Required: SELORG_UPLOAD_STORE_FILE, SELORG_UPLOAD_STORE_PASSWORD,
    //           SELORG_UPLOAD_KEY_ALIAS, SELORG_UPLOAD_KEY_PASSWORD
    // Opt-out (smoke only): -PallowUnsignedRelease=true → genuinely unsigned *-unsigned.apk/.aab
    def releaseSigningPropNames = [
        'SELORG_UPLOAD_STORE_FILE',
        'SELORG_UPLOAD_STORE_PASSWORD',
        'SELORG_UPLOAD_KEY_ALIAS',
        'SELORG_UPLOAD_KEY_PASSWORD'
    ]
    def releaseSigningProps = releaseSigningPropNames.collectEntries { name ->
        [(name): (project.findProperty(name)?.toString()?.trim() ?: '')]
    }
    def releaseSigningPresent = releaseSigningProps.findAll { _, value -> !value.isEmpty() }.keySet()
    def releaseSigningMissing = releaseSigningPropNames.findAll { !releaseSigningPresent.contains(it) }
    def hasCompleteReleaseSigning = releaseSigningMissing.isEmpty()
    def hasPartialReleaseSigning = !releaseSigningPresent.isEmpty() && !hasCompleteReleaseSigning
    // Explicit -P only. Never default. Forces unsigned even if upload props exist.
    def allowUnsignedRelease = project.findProperty('allowUnsignedRelease')?.toString()?.equalsIgnoreCase('true') == true

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasCompleteReleaseSigning) {
                def storeFileCandidate = file(releaseSigningProps['SELORG_UPLOAD_STORE_FILE'])
                if (!storeFileCandidate.isFile()) {
                    throw new GradleException(
                        "SELORG_UPLOAD_STORE_FILE does not exist or is not a file: ${storeFileCandidate.absolutePath}"
                    )
                }
                storeFile storeFileCandidate
                storePassword releaseSigningProps['SELORG_UPLOAD_STORE_PASSWORD']
                keyAlias releaseSigningProps['SELORG_UPLOAD_KEY_ALIAS']
                keyPassword releaseSigningProps['SELORG_UPLOAD_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [
                usesCleartextTraffic: "true",
                GOOGLE_MAPS_API_KEY: project.findProperty("GOOGLE_MAPS_API_KEY") ?: ""
            ]
        }
        release {
            // Production path: upload keystore only. allowUnsignedRelease must never become default.
            if (hasCompleteReleaseSigning && !allowUnsignedRelease) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // Fail release early when upload signing is missing (unless explicitly opted out).
    gradle.taskGraph.whenReady { graph ->
        def releaseRequested = graph.allTasks.any { task ->
            def name = task.name
            name.contains('Release') && (
                name.startsWith('assemble') ||
                name.startsWith('bundle') ||
                name.startsWith('install') ||
                name.startsWith('package')
            )
        }
        if (!releaseRequested) return

        def mapsKey = project.findProperty('GOOGLE_MAPS_API_KEY')?.toString()?.trim()
        if (!mapsKey) {
            throw new GradleException(
                'Release build needs GOOGLE_MAPS_API_KEY in ~/.gradle/gradle.properties or CI ' +
                '(or -PGOOGLE_MAPS_API_KEY=...). An empty key ships a blank map. Do not commit the key.'
            )
        }

        if (hasPartialReleaseSigning) {
            throw new GradleException(
                'Incomplete release signing properties. Missing: ' +
                releaseSigningMissing.join(', ') +
                '. Set all four SELORG_UPLOAD_* values in ~/.gradle/gradle.properties or CI, ' +
                'or pass -PallowUnsignedRelease=true only for explicit unsigned smoke builds.'
            )
        }

        if (!hasCompleteReleaseSigning && !allowUnsignedRelease) {
            throw new GradleException(
                'Release build needs SELORG_UPLOAD_STORE_FILE, SELORG_UPLOAD_STORE_PASSWORD, ' +
                'SELORG_UPLOAD_KEY_ALIAS, and SELORG_UPLOAD_KEY_PASSWORD in ~/.gradle/gradle.properties or CI. ' +
                'Pass -PallowUnsignedRelease=true only for explicit unsigned smoke builds.'
            )
        }
    }

    applicationVariants.all { variant ->
        def releaseUnsignedArtifact =
            variant.buildType.name == 'release' &&
            (allowUnsignedRelease || !signingConfigs.release.storeFile)

        variant.outputs.all { output ->
            def version = variant.versionName
            outputFileName = releaseUnsignedArtifact
                ? "selorg-customer-app-${version}-unsigned.apk"
                : "selorg-customer-app-${version}.apk"
        }

        tasks.named("bundle${variant.name.capitalize()}").configure { bundleTask ->
            bundleTask.doLast {
                def version = variant.versionName
                def aabName = releaseUnsignedArtifact
                    ? "selorg-customer-app-${version}-unsigned.aab"
                    : "selorg-customer-app-${version}.aab"
                def aabDir = new File("${buildDir}/outputs/bundle/${variant.name}")
                aabDir.listFiles()?.each { file ->
                    if (file.name.endsWith(".aab")) {
                        file.renameTo(new File(aabDir, aabName))
                    }
                }
            }
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Android 12+ splash handoff (prevents stuck black splash over RN content)
    implementation("androidx.core:core-splashscreen:1.0.1")

    // Add support for animated GIFs and WebP images (e.g. Cloudinary dynamic outputs)
    implementation("com.facebook.fresco:animated-gif:3.6.0")
    implementation("com.facebook.fresco:animated-webp:3.6.0")
    implementation("com.facebook.fresco:webpsupport:3.6.0")

    // AsyncStorage pulls sqlite-bundled 2.6.0 and datastore 1.1.7, whose
    // libsqliteJni.so / libdatastore_shared_counter.so have RELRO segments that
    // fail Android 15+ 16 KB page-size checks.
    constraints {
        ["sqlite", "sqlite-framework", "sqlite-bundled"].each { artifact ->
            implementation("androidx.sqlite:${artifact}:2.6.2") {
                because "16 KB page-size aligned libsqliteJni.so"
            }
        }
        ["datastore", "datastore-core", "datastore-core-okio", "datastore-preferences", "datastore-preferences-core"].each { artifact ->
            implementation("androidx.datastore:${artifact}:1.2.1") {
                because "16 KB page-size aligned libdatastore_shared_counter.so"
            }
        }
    }
}

apply plugin: "com.google.gms.google-services"
